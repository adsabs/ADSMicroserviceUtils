[project]
name = "adsmutils"
version = "0.0.1"
description = "ADS Microservice Utils"
authors = [{ name = "NASA/SAO ADS", email = "adshelp@cfa.harvard.edu" }]
license = { text = "MIT" }
readme = "README.md"
packages = ["adsmutils"]
dependencies = [
    "concurrent-log-handler==0.9.29",
    "DateTime==4.3.0",
    "Flask==2.3.2",
    "Flask-SQLAlchemy==3.0.5",
    "Flask-RESTful==0.3.10",
    "flask-discoverer==0.1.6",
    "python-dateutil==2.9.0.post0",
    "python-json-logger==3.3.0",
    "requests>=2.25.1",
    "setuptools>=62.0.0",
    "SQLAlchemy>=1.4.18,<2.0.0",
    "werkzeug==2.3.8"
]

[project.optional-dependencies]
dev = [
    "Flask-Testing==0.8.1",
    "httpretty==1.1.4",
    "testing.postgresql==1.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "mock==5.2.0",
    "psycopg2-binary==2.9.12",
    "coverage==7.15.0",
    "coveralls==4.1.0",
    "flake8==7.3.0",
    "black==26.5.1",
    "isort==8.0.1"
]

[build-system]
requires = [
    "setuptools>=62.0.0",
    "wheel",
    "flit_core >=3.2,<4",
    "ppsetuptools==2.0.2"
]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
addopts = "--cov=adsmutils --cov-report=term-missing"
testpaths = ["adsmutils/tests"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
